<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noticias Bitcoin | Polyline</title>
  <link rel="stylesheet" href="../css/noticias.css" />
</head>
<body>
<main class="ia-section">
  <header class="ia-header">
    <h1>Noticias sobre Bitcoin</h1>
    <p class="ia-subtitle">Lo más reciente en criptomonedas, blockchain y tendencias de Bitcoin.</p>
  </header>

  <!-- Deja vacío, JS lo llenará -->
  <section class="ia-grid"></section>
</main>

<script>
(async () => {
  const GRID = document.getElementById('btc-grid');
  GRID.innerHTML = "<p>Cargando noticias...</p>";

  const ENDPOINT = "/.netlify/functions/bitcoinNews"; // en producción Netlify
  // O pega tu URL absoluta si estás probando desde localhost sin proxy:
  // const ENDPOINT = "https://<tu-sitio>.netlify.app/.netlify/functions/bitcoinNews";

  try {
    const res = await fetch(ENDPOINT);
    const items = await res.json();
    GRID.innerHTML = items.map(n => `
      <article class="ia-card">
        <a class="ia-card-image" href="${n.url}" target="_blank" rel="noopener noreferrer">
          <img src="${n.image || 'https://via.placeholder.com/900x500?text=Bitcoin'}" alt="${n.title}">
        </a>
        <div class="ia-card-body">
          <div class="ia-card-meta">
            <span class="chip">${n.source || 'Fuente'}</span>
            <time datetime="${n.publishedAt || ''}">
              ${n.publishedAt ? new Date(n.publishedAt).toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'}) : ''}
            </time>
          </div>
          <h3 class="ia-card-title">
            <a href="${n.url}" target="_blank" rel="noopener noreferrer">${n.title}</a>
          </h3>
          <p class="ia-card-excerpt">${n.summary || ''}</p>
          <a class="ia-card-link" href="${n.url}" target="_blank" rel="noopener noreferrer">Leer más</a>
        </div>
      </article>
    `).join('');
  } catch (err) {
    GRID.innerHTML = `<p style="color:#c00">No se pudieron cargar las noticias. ${err}</p>`;
  }
})();
</script>
</body>
</html>
