<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noticias IA | Polyline</title>

  <link rel="stylesheet" href="../css/style.css" />
  <!-- estilos de noticias, debe ir DESPUÉS -->
  <link rel="stylesheet" href="../css/noticias.css" />
</head>
<body>

  <!-- PRELOADER -->
  <div id="loading-screen" class="loading-screen" style="display:flex; opacity:1; transform:translateY(0)">
    <div class="logo-container">
      <img src="../Resource/Logo/logo.png" alt="Logo de POLYLINE" class="logo">
      <h1 class="company-name">POLYLINE</h1>
      <p class="slogan">CONSTRUCTORA</p>
    </div>
  </div>

  <main class="ia-section">
    <header class="ia-header">
      <h1>Noticias sobre Inteligencia Artificial</h1>
      <p class="ia-subtitle">Lo más reciente en IA, investigación, herramientas y tendencias.</p>
    </header>

    <section id="ia-grid" class="ia-grid" aria-live="polite">
      <!-- Skeletons iniciales -->
      <article class="skel-card"><div class="skel-media skeleton"></div><div class="skeleton skel-line w80"></div><div class="skeleton skel-line w60"></div><div class="skeleton skel-line w40"></div></article>
      <article class="skel-card"><div class="skel-media skeleton"></div><div class="skeleton skel-line w80"></div><div class="skeleton skel-line w60"></div><div class="skeleton skel-line w40"></div></article>
      <article class="skel-card"><div class="skel-media skeleton"></div><div class="skeleton skel-line w80"></div><div class="skeleton skel-line w60"></div><div class="skeleton skel-line w40"></div></article>
    </section>
  </main>

  <script>
    /* ---------- PRELOADER con mínimo visible ---------- */
    let __preloadStart = performance.now();

    function showPreloader() {
      const scr = document.getElementById('loading-screen');
      if (!scr) return;
      scr.style.display = 'flex';
      void scr.offsetHeight;                 // reflow
      scr.style.opacity = '1';
      scr.style.transform = 'translateY(0)';
      __preloadStart = performance.now();
    }

    function hidePreloader() {
      const scr = document.getElementById('loading-screen');
      if (!scr || scr.style.display === 'none') return;

      const MIN_VISIBLE = 1100;              // <-- ajusta a tu gusto (ms)
      const elapsed = performance.now() - __preloadStart;
      const wait = Math.max(0, MIN_VISIBLE - elapsed);

      setTimeout(() => {
        scr.style.transform = 'translateY(-100%)';
        scr.style.opacity = '0';
        scr.addEventListener('transitionend', () => {
          scr.style.display = 'none';
        }, { once: true });
      }, wait);
    }

    // Exponer para otras páginas si quisieras reutilizar
    window.__showPreloader = showPreloader;
    window.__hidePreloader = hidePreloader;

    // Cerrar por si el DOM entra rapidísimo
    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(hidePreloader);
    });
    // Cerrar también al terminar la carga “pesada”
    window.addEventListener('load', hidePreloader);

    /* ---------- Cargar noticias IA ---------- */
    async function loadNews() {
      const grid = document.querySelector('.ia-grid');
      grid.innerHTML = '<p>Cargando noticias…</p>';

      try {
        // Usa ruta relativa para que funcione en cualquier dominio
        const res = await fetch('/.netlify/functions/aiNews', {
          headers: { 'cache-control': 'no-cache' }
        });
        if (!res.ok) throw new Error('Error HTTP ' + res.status);
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          grid.innerHTML = '<p>No hay noticias por ahora.</p>';
          return;
        }

        grid.innerHTML = '';
        data.forEach(n => {
          const card = document.createElement('article');
          card.className = 'ia-card';
          const safeTitle = (n.title || 'Noticia de IA').replace(/"/g, '&quot;');
          card.innerHTML = `
            <a class="ia-card-image" href="${n.url}" target="_blank" rel="noopener noreferrer" aria-label="Abrir noticia: ${safeTitle}">
              <img src="${n.image || 'https://via.placeholder.com/900x500?text=IA'}" alt="${safeTitle}">
            </a>
            <div class="ia-card-body">
              <div class="ia-card-meta">
                <span class="chip">${n.source || 'Fuente'}</span>
                <time datetime="${n.publishedAt || ''}">
                  ${n.publishedAt ? new Date(n.publishedAt).toLocaleDateString('es-PE', { day:'2-digit', month:'short', year:'numeric' }) : ''}
                </time>
              </div>
              <h3 class="ia-card-title">
                <a href="${n.url}" target="_blank" rel="noopener noreferrer">${safeTitle}</a>
              </h3>
              <p class="ia-card-excerpt">${n.summary || ''}</p>
              <a class="ia-card-link" href="${n.url}" target="_blank" rel="noopener noreferrer">Leer más</a>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p style="color:#c00">No se pudieron cargar las noticias.</p>';
      } finally {
        // cierre seguro del preloader
        if (window.__hidePreloader) window.__hidePreloader();
      }
    }

    document.addEventListener('DOMContentLoaded', loadNews);
  </script>
</body>
</html>
